<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turno noturno — Controle de Horas Extras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-left">
        <p class="brand-name">Controle de Horas Extras</p>
        <nav class="app-nav">
          <a href="dashboard.html">Início</a>
          <a href="overtime.html">Horas extras</a>
          <a href="mealvoucher.html">Vale-refeição</a>
          <a href="nightshift.html" class="active">Turno noturno</a>
        </nav>
      </div>
      <div class="user-area">
        <span id="user-greeting"></span>
        <button id="logout-button" class="ghost-button" type="button">Sair</button>
      </div>
    </header>

    <main class="app-content">
      <div class="page-heading">
        <h2>Turno noturno</h2>
      </div>

      <!-- Resumo -->
      <section class="summary-cards" id="summary-cards">
        <div class="summary-card">
          <span class="label">Total de horas noturnas</span>
          <span class="value" id="summary-total-night-hours">—</span>
        </div>
        <div class="summary-card">
          <span class="label">Adicional noturno</span>
          <span class="value" id="summary-total-night-value">—</span>
        </div>
        <div class="summary-card total">
          <span class="label">Total a receber</span>
          <span class="value" id="summary-total">—</span>
        </div>
      </section>

      <div class="overtime-layout">
        <!-- Formulário de registro: POST /nightShift -->
        <section class="form-card">
          <h3 id="form-title">Registrar turno noturno</h3>

          <div id="form-error-box" class="error-box" role="alert" hidden></div>
          <div id="form-success-box" class="success-box" role="status" hidden></div>

          <form id="nightshift-form" novalidate>
            <div class="field">
              <label for="total-night-hours">Quantidade de horas noturnas</label>
              <input type="number" id="total-night-hours" name="totalNightHours" min="1" max="12" step="0.5" required>
            </div>
            <div class="field">
              <label for="date">Data</label>
              <input type="date" id="date" name="date" required>
            </div>
            <button type="submit" id="submit-button" class="primary-button">Registrar</button>
          </form>
        </section>

        <!-- Listagem: GET /nightShift -->
        <section class="table-card">
          <div class="table-scroll">
            <table class="overtime-table">
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Horas noturnas</th>
                  <th>Adicional noturno</th>
                  <th>Data pgto.</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="nightshift-table-body">
                <!-- linhas geradas via JS -->
              </tbody>
            </table>
          </div>
          <div id="empty-state" class="empty-state" hidden>Nenhum registro encontrado.</div>

          <div class="table-footer">
            <span id="page-indicator">—</span>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/header.js"></script>
  <script src="js/nightshift.js"></script>
</body>
</html>
