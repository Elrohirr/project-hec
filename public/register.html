<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — Controle de Horas Extras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-screen">
    <aside class="login-brand">
      <div>
        <p class="brand-name">Controle de Horas Extras</p>
        <p class="brand-tagline">registro &amp; aprovação de jornada</p>
      </div>

      <div class="punch-stamp" aria-hidden="true">
        <span class="tick" style="transform: translateX(-50%) rotate(0deg);"></span>
        <span class="tick" style="transform: translateX(-50%) rotate(30deg);"></span>
        <span class="tick" style="transform: translateX(-50%) rotate(60deg);"></span>
        <span class="tick" style="transform: translateX(-50%) rotate(90deg);"></span>
        <span class="tick" style="transform: translateX(-50%) rotate(120deg);"></span>
        <span class="tick" style="transform: translateX(-50%) rotate(150deg);"></span>
        <span class="tick" style="transform: translateX(-50%) rotate(180deg);"></span>
        <span class="tick" style="transform: translateX(-50%) rotate(210deg);"></span>
        <span class="tick" style="transform: translateX(-50%) rotate(240deg);"></span>
        <span class="tick" style="transform: translateX(-50%) rotate(270deg);"></span>
        <span class="tick" style="transform: translateX(-50%) rotate(300deg);"></span>
        <span class="tick" style="transform: translateX(-50%) rotate(330deg);"></span>
        <span class="hand hand-hour"></span>
        <span class="hand"></span>
        <span class="hub"></span>
        <span class="stamp-label">PONTO REGISTRADO</span>
      </div>

      <p class="brand-footnote">v0.1 — projeto interno</p>
    </aside>

    <main class="login-form-panel">
      <div class="login-card">
        <h1>Criar conta</h1>
        <p class="subtitle">Preencha seus dados para começar a registrar seu ponto.</p>

        <div id="error-box" class="error-box" role="alert" hidden></div>
        <div id="success-box" class="success-box" role="status" hidden></div>

        <form id="register-form" novalidate>
          <div class="field-row">
            <div class="field">
              <label for="name">Nome</label>
              <input type="text" id="name" name="name" autocomplete="given-name" required>
            </div>
            <div class="field">
              <label for="surname">Sobrenome</label>
              <input type="text" id="surname" name="surname" autocomplete="family-name" required>
            </div>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="wage">Salário-hora (R$)</label>
            <input type="number" id="wage" name="wage" min="0" step="0.01" inputmode="decimal" required>
            <span class="hint">Usado para calcular o valor das horas extras.</span>
          </div>
          <div class="field">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
          </div>
          <div class="field">
            <label for="password-confirm">Confirmar senha</label>
            <input type="password" id="password-confirm" name="password-confirm" autocomplete="new-password" required>
          </div>
          <button type="submit" id="submit-button" class="primary-button">Criar conta</button>
        </form>

        <p class="switch-link">Já tem conta? <a href="index.html">Entrar</a></p>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
